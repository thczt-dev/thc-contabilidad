name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verificar código fuente
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Comprobar sintaxis
        run: python -m compileall -q thc_contabilidad

      - name: Comprobar metadatos JSON
        run: python -m json.tool proyecto.json > /dev/null
